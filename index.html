<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sokoban 3D — PHC 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #07090f;
      color: #e8eef7;
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(1100px 700px at 12% -10%, rgba(56, 189, 248, 0.16), transparent 60%),
        radial-gradient(900px 700px at 108% 12%, rgba(167, 139, 250, 0.16), transparent 55%),
        radial-gradient(1000px 800px at 50% 120%, rgba(52, 211, 153, 0.12), transparent 58%),
        #07090f;
      overflow: hidden;
    }

    .bg::before,
    .bg::after {
      content: "";
      position: absolute;
      width: 42vw;
      height: 42vw;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.22;
    }

    .bg::before {
      left: -12vw;
      top: -12vh;
      background: radial-gradient(circle, #38bdf8, transparent 70%);
      animation: floatA 18s ease-in-out infinite alternate;
    }

    .bg::after {
      right: -12vw;
      bottom: -12vh;
      background: radial-gradient(circle, #a78bfa, transparent 70%);
      animation: floatB 22s ease-in-out infinite alternate;
    }

    @keyframes floatA {
      to {
        transform: translate(8vw, 6vh) scale(1.08);
      }
    }

    @keyframes floatB {
      to {
        transform: translate(-7vw, -9vh) scale(1.12);
      }
    }

    canvas {
      position: fixed;
      inset: 0;
      bottom: 26px; /* progress strip lives here; canvas ends above it */
      z-index: 1;
      display: block;
      touch-action: none;
    }

    .glass {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }

    /* ------------------------------------------------------------------ */
    /* Top HUD: one compact strip, vertical-first                          */
    /* ------------------------------------------------------------------ */

    #topbar {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }

    #topbar > * {
      pointer-events: auto;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 12px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .logo .orb {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: conic-gradient(from 90deg, #67e8f9, #a78bfa, #34d399, #67e8f9);
      box-shadow: 0 0 12px rgba(103, 232, 249, 0.75);
      flex: none;
    }

    .logo .badge {
      display: none;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.9px;
      color: #dbeafe;
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.22), rgba(167, 139, 250, 0.22));
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    @media (min-width: 600px) {
      .logo .badge {
        display: inline-block;
      }
    }

    /* Tiny M / B / Best cluster. */

    #hud-stats {
      display: flex;
      gap: 6px;
      padding: 5px;
      border-radius: 12px;
    }

    .stat {
      min-width: 54px;
      padding: 4px 8px 5px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
    }

    .stat span {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #93a1b5;
      line-height: 1;
    }

    .stat strong {
      font-size: 12px;
      color: white;
      font-weight: 800;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    /* ------------------------------------------------------------------ */
    /* Bottom progress strip (sits in the canvas inset, never overlaps)    */
    /* ------------------------------------------------------------------ */

    #progress-dock {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 9px;
      pointer-events: none;
    }

    #level-info {
      flex: none;
      font-family: "Space Grotesk", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #b8c4d4;
      font-variant-numeric: tabular-nums;
    }

    #level-info strong {
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      margin-right: 3px;
    }

    .bar {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    #progress-fill {
      height: 100%;
      width: 2%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22d3ee, #a78bfa, #34d399);
      transition: width 0.35s ease;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.35);
    }

    /* ------------------------------------------------------------------ */
    /* First-move hint                                                     */
    /* ------------------------------------------------------------------ */

    #hint {
      position: fixed;
      left: 50%;
      top: 58%;
      z-index: 2;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #eaf2ff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #hint.show {
      opacity: 1;
      animation: hintBob 2.2s ease-in-out infinite;
    }

    #hint .chevrons {
      display: flex;
      gap: 3px;
      flex: none;
    }

    #hint .chevrons i {
      width: 7px;
      height: 7px;
      border-right: 2px solid #67e8f9;
      border-bottom: 2px solid #67e8f9;
      transform: rotate(-45deg);
      border-radius: 1px;
      animation: chev 1.4s ease-in-out infinite;
    }

    #hint .chevrons i:nth-child(2) {
      animation-delay: 0.15s;
      opacity: 0.7;
    }

    #hint .chevrons i:nth-child(3) {
      animation-delay: 0.3s;
      opacity: 0.45;
    }

    @keyframes chev {
      0%, 100% {
        transform: rotate(-45deg) translate(0, 0);
      }
      50% {
        transform: rotate(-45deg) translate(2px, -2px);
      }
    }

    @keyframes hintBob {
      0%, 100% {
        transform: translate(-50%, -50%);
      }
      50% {
        transform: translate(-50%, calc(-50% - 5px));
      }
    }

    #hint small {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #9fb0c6;
    }

    @media (max-height: 480px) {
      #hint {
        top: 70%;
        font-size: 12px;
        padding: 8px 12px;
      }
    }

    /* ------------------------------------------------------------------ */
    /* Toast, flash, overlay (unchanged)                                   */
    /* ------------------------------------------------------------------ */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 38px;
      transform: translateX(-50%) translateY(8px);
      z-index: 2;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #eaf2ff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #flash {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 55%, rgba(52, 211, 153, 0.42), rgba(34, 211, 238, 0.16) 35%, transparent 65%);
    }

    #flash.on {
      animation: flash 0.7s ease-out;
    }

    @keyframes flash {
      0% {
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, rgba(34, 211, 238, 0.12), rgba(3, 6, 12, 0.62));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #overlay[hidden] {
      display: none;
    }

    #overlay-card {
      width: min(430px, calc(100vw - 36px));
      padding: 26px 24px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(15, 20, 32, 0.92), rgba(8, 11, 18, 0.88));
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
      text-align: center;
      animation: cardIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.25);
    }

    @keyframes cardIn {
      from {
        transform: translateY(16px) scale(0.96);
        opacity: 0;
      }

      to {
        transform: none;
        opacity: 1;
      }
    }

    #overlay-card h2 {
      margin: 0 0 6px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 30px;
      line-height: 1.1;
      background: linear-gradient(90deg, #67e8f9, #a78bfa, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    #overlay-sub {
      margin: 0 0 18px;
      color: #b8c4d4;
      font-size: 14px;
    }

    .overlay-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .overlay-stats div {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px;
    }

    .overlay-stats span {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #93a1b5;
    }

    .overlay-stats strong {
      font-size: 20px;
      color: white;
      font-weight: 800;
    }

    .btn {
      margin: 0 6px;
      padding: 11px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.32);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.primary {
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      border-color: transparent;
      box-shadow: 0 12px 26px rgba(6, 182, 212, 0.24);
    }

    .btn.primary:hover {
      box-shadow: 0 16px 32px rgba(6, 182, 212, 0.3);
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <header id="topbar">
    <div class="logo glass">
      <span class="orb"></span>
      <span>Sokoban 3D</span>
      <span class="badge">PHC 2026</span>
    </div>

    <div id="hud-stats" class="glass">
      <div class="stat">
        <span>Moves</span>
        <strong id="status-moves">0</strong>
      </div>
      <div class="stat">
        <span>Boxes</span>
        <strong id="status-boxes">0</strong>
      </div>
      <div class="stat">
        <span>Best</span>
        <strong id="status-best">—</strong>
      </div>
    </div>
  </header>

  <div id="hint" class="glass" aria-hidden="true">
    <span class="chevrons"><i></i><i></i><i></i></span>
    <span>
      Swipe to move the cube
      <small>or W A S D / arrows on desktop</small>
    </span>
  </div>

  <div id="progress-dock">
    <span id="level-info"><strong>1</strong>/100</span>
    <div class="bar">
      <div id="progress-fill"></div>
    </div>
  </div>

  <div id="toast" class="glass"></div>
  <div id="flash"></div>

  <div id="overlay" hidden>
    <div id="overlay-card">
      <h2 id="overlay-title">Level Complete!</h2>
      <p id="overlay-sub"></p>

      <div class="overlay-stats">
        <div>
          <span>Moves</span>
          <strong id="overlay-moves">0</strong>
        </div>
        <div>
          <span>Best</span>
          <strong id="overlay-best">—</strong>
        </div>
        <div>
          <span>Crates</span>
          <strong id="overlay-crates">0</strong>
        </div>
      </div>

      <button id="btn-restart" class="btn">Restart</button>
      <button id="btn-next" class="btn primary">Next Level</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // =====================================================================
    // Level definitions
    //
    // # = wall
    // . = target
    // @ = player
    // $ = crate
    // + = player on target
    // * = crate on target
    //
    // The first five layouts are hand-written; the rest are generated.
    // Every generated layout is built from small, verifiable pieces:
    //
    //   * a solid outer boundary,
    //   * wall bays / protrusions and interior pillars for variety,
    //   * one private, straight push lane per crate (start -> dock),
    //     with the dock direction (up / down / left / right) free to
    //     differ per crate.
    //
    // After assembly a simulation proves the level is solvable: crates
    // are pushed along their lanes in a shuffled order while a BFS
    // proves the player can reach each push cell. If any check fails the
    // layout is rebuilt with a new seed, so a hard level is never
    // accidentally impossible.
    //
    // Layouts are seeded by their index, so level 17 always generates
    // the same puzzle on every machine (best scores stay comparable).
    // Want a fresh puzzle on every page load instead? Change LAYOUT_SEED
    // to (Math.random() * 0xffffffff) | 0.
    //
    // Difficulty t runs 0 -> 1 across the generated set, so the last 25
    // levels (1/2 of the generated range) draw the largest boards, the
    // most crates, the longest push distances and the densest bays —
    // the hardest stretch of the game.
    // =====================================================================

    const BASE_LEVELS = [
      [
        "#####",
        "#@$.#",
        "#####"
      ],
      [
        "######",
        "#    #",
        "# $ .#",
        "# @  #",
        "######"
      ],
      [
        "######",
        "#  ..#",
        "# $$ #",
        "# @  #",
        "######"
      ],
      [
        "#######",
        "#     #",
        "# $ $ #",
        "#  @  #",
        "# ..  #",
        "#######"
      ],
      [
        "#######",
        "#     #",
        "# $$$ #",
        "# ... #",
        "#  @  #",
        "#######"
      ]
    ];

    // ------------------------------------------------------------------
    // Seeded generation helpers
    // ------------------------------------------------------------------

    const LAYOUT_SEED = 20260521;

    function mulberry32(seed) {
      let a = seed >>> 0;

      return function () {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function randInt(rng, min, max) {
      return min + Math.floor(rng() * (max - min + 1));
    }

    function pick(rng, arr) {
      return arr[Math.floor(rng() * arr.length)];
    }

    function shuffle(rng, arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        const tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    function clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    }

    const DIR4 = [
      { x: 0, z: -1 },
      { x: 0, z: 1 },
      { x: -1, z: 0 },
      { x: 1, z: 0 }
    ];

    // Flood fill from (x, z) over every cell not present in `blocked`.
    // Returns the set of reachable "x,z" keys.
    function reachable(x, z, blocked) {
      const seen = new Set([x + "," + z]);
      const stack = [[x, z]];

      while (stack.length) {
        const top = stack.pop();
        const cx = top[0];
        const cz = top[1];

        for (let i = 0; i < 4; i++) {
          const nx = cx + DIR4[i].x;
          const nz = cz + DIR4[i].z;
          const k = nx + "," + nz;

          if (!seen.has(k) && !blocked.has(k)) {
            seen.add(k);
            stack.push([nx, nz]);
          }
        }
      }

      return seen;
    }

    // ------------------------------------------------------------------
    // Layout attempt: returns grid rows, or null to try another seed.
    // `t` is difficulty, 0 (early levels) -> 1 (late levels).
    // ------------------------------------------------------------------

    function tryGenerateLevel(rng, t) {
      const W = clamp(8 + Math.round(t * 9) + randInt(rng, -1, 2), 8, 19);
      const H = clamp(8 + Math.round(t * 5) + randInt(rng, -1, 2), 8, 14);

      const cx = (W - 1) / 2;
      const cz = (H - 1) / 2;

      const grid = [];

      for (let z = 0; z < H; z++) {
        const row = [];

        for (let x = 0; x < W; x++) {
          row.push((x === 0 || x === W - 1 || z === 0 || z === H - 1) ? "#" : " ");
        }

        grid.push(row);
      }

      const inRoom = (x, z) => x > 0 && x < W - 1 && z > 0 && z < H - 1;
      const isWall = (x, z) => !inRoom(x, z) || grid[z][x] === "#";

      // ---- Boundary bays: wall blocks jutting in from an edge --------

      const bayCount = randInt(rng, 1, 1 + Math.round(t * 3));

      function placeBlock(x0, z0, w, h) {
        for (let z = z0; z < z0 + h; z++) {
          for (let x = x0; x < x0 + w; x++) {
            if (grid[z][x] !== " ") return false;
          }
        }

        for (let z = z0; z < z0 + h; z++) {
          for (let x = x0; x < x0 + w; x++) {
            grid[z][x] = "#";
          }
        }

        return true;
      }

      for (let i = 0; i < bayCount; i++) {
        const side = randInt(rng, 0, 3); // 0 top, 1 bottom, 2 left, 3 right
        const depth = randInt(rng, 1, 2);
        const width = randInt(rng, 1, 2);

        for (let tries = 0; tries < 24; tries++) {
          let ok = false;

          if (side === 0) {
            ok = placeBlock(randInt(rng, 2, W - 3), 1, width, depth);
          } else if (side === 1) {
            ok = placeBlock(randInt(rng, 2, W - 3), H - 1 - depth, width, depth);
          } else if (side === 2) {
            ok = placeBlock(1, randInt(rng, 2, H - 3), depth, width);
          } else {
            ok = placeBlock(W - 1 - depth, randInt(rng, 2, H - 3), depth, width);
          }

          if (ok) break;
        }
      }

      // ---- Crates: one private straight push lane each ---------------

      // The last quarter of the difficulty ramp gets one extra lane per
      // board so levels 75-100 carry the heaviest crate counts.
      const extraCrate = t > 0.75 && rng() < 0.5 ? 1 : 0;
      const crateCount = clamp(
        2 + Math.round(t * 6) + extraCrate + (rng() < 0.3 ? 1 : 0),
        2,
        9
      );
      const maxDist = clamp(2 + Math.round(t * 5) + randInt(rng, 0, 2), 2, 8);

      // Dock candidates: floor cells that touch a wall, with the push
      // direction pointing into that wall.
      const docks = [];

      for (let z = 1; z < H - 1; z++) {
        for (let x = 1; x < W - 1; x++) {
          if (grid[z][x] !== " ") continue;

          for (let d = 0; d < 4; d++) {
            if (isWall(x + DIR4[d].x, z + DIR4[d].z)) {
              docks.push({ x: x, z: z, dir: DIR4[d] });
            }
          }
        }
      }

      shuffle(rng, docks);

      const lanes = [];
      const usedCells = new Set();

      for (let i = 0; i < docks.length && lanes.length < crateCount; i++) {
        const dock = docks[i];
        const dist = randInt(rng, 2, maxDist);
        const cells = [];
        let valid = true;

        // i=0 is the target, i=dist the crate start, i=dist+1 the cell
        // where the player must stand to begin the push.
        for (let n = 0; n <= dist + 1; n++) {
          const x = dock.x - dock.dir.x * n;
          const z = dock.z - dock.dir.z * n;
          const k = x + "," + z;

          if (!inRoom(x, z) || grid[z][x] !== " " || usedCells.has(k)) {
            valid = false;
            break;
          }

          cells.push({ x: x, z: z });
        }

        if (!valid) continue;

        cells.forEach(c => usedCells.add(c.x + "," + c.z));

        lanes.push({
          target: cells[0],
          start: cells[dist],
          pushFrom: cells[dist + 1],
          dir: dock.dir,
          dist: dist
        });
      }

      if (lanes.length < crateCount) return null;

      // ---- Interior pillars / blocks (kept off the lanes) ------------

      const obstacleCount = clamp(1 + Math.round(t * 7), 1, 10);
      const shapes = [[1, 1], [2, 1], [1, 2], [2, 2], [3, 1], [1, 3]];

      for (let i = 0; i < obstacleCount; i++) {
        const shape = pick(rng, shapes);
        const w = shape[0];
        const h = shape[1];

        for (let tries = 0; tries < 28; tries++) {
          const x0 = randInt(rng, 2, W - 3 - w);
          const z0 = randInt(rng, 2, H - 3 - h);

          let valid = true;

          for (let z = z0; z < z0 + h && valid; z++) {
            for (let x = x0; x < x0 + w && valid; x++) {
              if (grid[z][x] !== " " || usedCells.has(x + "," + z)) valid = false;
            }
          }

          if (!valid) continue;

          for (let z = z0; z < z0 + h; z++) {
            for (let x = x0; x < x0 + w; x++) {
              grid[z][x] = "#";
            }
          }

          break;
        }
      }

      // ---- Player start: open cell near the middle -------------------

      const startCandidates = [];

      for (let z = 2; z <= H - 3; z++) {
        for (let x = 2; x <= W - 3; x++) {
          if (grid[z][x] === " " && !usedCells.has(x + "," + z)) {
            startCandidates.push({
              x: x,
              z: z,
              score: (x - cx) * (x - cx) + (z - cz) * (z - cz) + rng() * 4
            });
          }
        }
      }

      if (!startCandidates.length) return null;

      startCandidates.sort((a, b) => a.score - b.score);
      const start = startCandidates[0];

      // ---- Solvability check: simulate the pushes --------------------
      //
      // Lanes are cell-disjoint and crates only ever sit on their own
      // lane, so a crate is only ever blocked by walls or by the crates
      // that have not been pushed yet. Trying a few crate orders makes
      // the check forgiving while still guaranteeing correctness.

      const walls = new Set();

      for (let z = 0; z < H; z++) {
        for (let x = 0; x < W; x++) {
          if (grid[z][x] === "#") walls.add(x + "," + z);
        }
      }

      function solvableInOrder(order) {
        const pending = new Set();

        order.forEach(l => pending.add(l.start.x + "," + l.start.z));

        let px = start.x;
        let pz = start.z;

        for (let i = 0; i < order.length; i++) {
          const lane = order[i];

          const blocked = new Set(walls);
          pending.forEach(k => blocked.add(k));

          if (!reachable(px, pz, blocked).has(lane.pushFrom.x + "," + lane.pushFrom.z)) {
            return false;
          }

          let bx = lane.start.x;
          let bz = lane.start.z;

          for (let s = 0; s < lane.dist; s++) {
            const nx = bx + lane.dir.x;
            const nz = bz + lane.dir.z;
            const nk = nx + "," + nz;

            if (walls.has(nk) || pending.has(nk)) return false;

            pending.delete(bx + "," + bz);
            pending.add(nk);

            px = bx;
            pz = bz;
            bx = nx;
            bz = nz;
          }
        }

        return true;
      }

      let ok = false;

      for (let o = 0; o < 3 && !ok; o++) {
        ok = solvableInOrder(shuffle(rng, lanes.slice()));
      }

      if (!ok) return null;

      // ---- Stamp the result ------------------------------------------

      lanes.forEach(l => {
        grid[l.target.z][l.target.x] = ".";
        grid[l.start.z][l.start.x] = "$";
      });

      grid[start.z][start.x] = "@";

      return grid.map(row => row.join(""));
    }

    // Guaranteed-solvable safety net (practically never used).
    function fallbackLevel() {
      return [
        "#######",
        "#  $ .#",
        "# @   #",
        "#  $ .#",
        "#######"
      ];
    }

    function generateNewLevels(count) {
      const levels = [];

      for (let k = 0; k < count; k++) {
        const difficulty = count > 1 ? k / (count - 1) : 1;
        const seed = (LAYOUT_SEED ^ Math.imul(k + 1, 2654435761)) | 0;

        let grid = null;

        for (let attempt = 0; attempt < 60 && !grid; attempt++) {
          const rng = mulberry32(seed + Math.imul(attempt + 1, 40503));
          grid = tryGenerateLevel(rng, difficulty);
        }

        levels.push(grid || fallbackLevel());
      }

      return levels;
    }

    // 5 hand-written + 95 generated = 100 levels.
    const LEVELS = BASE_LEVELS.concat(generateNewLevels(95));

    // =====================================================================
    // DOM references
    // =====================================================================

    const levelInfo = document.getElementById("level-info");
    const progressFill = document.getElementById("progress-fill");
    const statusMoves = document.getElementById("status-moves");
    const statusBoxes = document.getElementById("status-boxes");
    const statusBest = document.getElementById("status-best");

    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlaySub = document.getElementById("overlay-sub");
    const overlayMoves = document.getElementById("overlay-moves");
    const overlayBest = document.getElementById("overlay-best");
    const overlayCrates = document.getElementById("overlay-crates");

    const btnRestart = document.getElementById("btn-restart");
    const btnNext = document.getElementById("btn-next");

    const toastEl = document.getElementById("toast");
    const flashEl = document.getElementById("flash");
    const hintEl = document.getElementById("hint");

    // =====================================================================
    // Movement definitions
    // =====================================================================

    const DIRS = {
      KeyW: { x: 0, z: -1 },
      ArrowUp: { x: 0, z: -1 },

      KeyS: { x: 0, z: 1 },
      ArrowDown: { x: 0, z: 1 },

      KeyA: { x: -1, z: 0 },
      ArrowLeft: { x: -1, z: 0 },

      KeyD: { x: 1, z: 0 },
      ArrowRight: { x: 1, z: 0 }
    };

    const heldDirs = [];

    // =====================================================================
    // Game state
    // =====================================================================

    let scene, camera, renderer, directional;

    let levelGroup = null;
    let playerMesh = null;

    let playerPos = { x: 0, z: 0 };

    let wallSet = new Set();
    let targetSet = new Set();
    let crateMap = new Map();

    let crates = [];
    let targetMeshes = [];

    let levelIndex = 0;
    let moves = 0;
    let won = false;

    let gridRows = 0;
    let gridCols = 0;

    let animatingCount = 0;
    let movementCooldown = 0;
    let levelGeneration = 0;

    let particles = [];

    let winTimeout = null;
    let toastTimer = null;
    let hintTimer = null;

    let mouseNX = 0;
    let mouseNY = 0;

    const cameraBase = new THREE.Vector3();
    const cameraLookAt = new THREE.Vector3();

    const clock = new THREE.Clock();

    const ANIM_DURATION = 0.14;
    const MOVE_COOLDOWN = 0.13;
    const MIN_SWIPE = 24;

    const PARTICLE_COLORS = [
      new THREE.Color(0x67e8f9),
      new THREE.Color(0x34d399),
      new THREE.Color(0xfbbf24),
      new THREE.Color(0xc4b5fd)
    ];

    // =====================================================================
    // Helpers
    // =====================================================================

    function key(x, z) {
      return x + "," + z;
    }

    function isAnimating() {
      return animatingCount > 0;
    }

    function isWall(x, z) {
      return wallSet.has(key(x, z));
    }

    function outOfBounds(x, z) {
      return x < 0 || z < 0 || x >= gridCols || z >= gridRows;
    }

    function getBest(level) {
      try {
        const value = localStorage.getItem(`sokoban-phc-2026-best-${level}`);
        return value ? Number(value) : null;
      } catch (err) {
        return null;
      }
    }

    function setBest(level, value) {
      try {
        localStorage.setItem(`sokoban-phc-2026-best-${level}`, String(value));
      } catch (err) {
        // Ignore storage errors.
      }
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 1400);
    }

    function flashNow() {
      flashEl.classList.remove("on");
      void flashEl.offsetWidth;
      flashEl.classList.add("on");
    }

    // =====================================================================
    // Three.js setup
    // =====================================================================

    function initThree() {
      scene = new THREE.Scene();
      // Fog distances are refit per level in frameLevel().
      scene.fog = new THREE.Fog(0x070a12, 30, 90);

      camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        300
      );

      // "Screen up" is world -z (the direction W moves). The default up
      // vector (0,1,0) is parallel to the top-down view direction, so
      // lookAt() hits its gimbal-lock case and the camera rolls/flips
      // as the drift & mouse parallax pass through that axis.
      camera.up.set(0, 0, -1);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      document.body.appendChild(renderer.domElement);

      const ambient = new THREE.AmbientLight(0xffffff, 0.52);
      scene.add(ambient);

      directional = new THREE.DirectionalLight(0xffffff, 0.9);
      directional.position.set(6, 12, 8);
      directional.castShadow = true;

      directional.shadow.mapSize.set(1024, 1024);
      directional.shadow.camera.near = 0.5;
      directional.shadow.camera.far = 80;
      directional.shadow.camera.left = -24;
      directional.shadow.camera.right = 24;
      directional.shadow.camera.top = 24;
      directional.shadow.camera.bottom = -24;
      directional.shadow.bias = -0.0005;

      scene.add(directional);
      scene.add(directional.target);

      const rimLight = new THREE.DirectionalLight(0x67e8f9, 0.18);
      rimLight.position.set(-6, 5, -8);
      scene.add(rimLight);

      window.addEventListener("resize", onResize);

      window.addEventListener("pointermove", e => {
        mouseNX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseNY = (e.clientY / window.innerHeight) * 2 - 1;
      });
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      // Aspect changes alter the fitted camera height (e.g. rotating a
      // phone), so reframe the board.
      if (levelGroup) frameLevel();
    }

    // =====================================================================
    // Level creation / cleanup
    // =====================================================================

    function clearLevel() {
      if (!levelGroup) return;

      levelGroup.traverse(obj => {
        if (obj.geometry) {
          obj.geometry.dispose();
        }

        if (obj.material) {
          if (Array.isArray(obj.material)) {
            obj.material.forEach(material => material.dispose());
          } else {
            obj.material.dispose();
          }
        }
      });

      scene.remove(levelGroup);
      levelGroup = null;
    }

    function clearParticles() {
      particles.forEach(p => {
        scene.remove(p.points);
        p.geometry.dispose();
        p.material.dispose();
      });

      particles.length = 0;
    }

    function loadLevel(index) {
      levelIndex = index;
      moves = 0;
      won = false;
      movementCooldown = 0;
      levelGeneration++;

      clearTimeout(winTimeout);
      heldDirs.length = 0;

      clearParticles();
      clearLevel();

      levelGroup = new THREE.Group();
      scene.add(levelGroup);

      wallSet.clear();
      targetSet.clear();
      crateMap.clear();

      crates = [];
      targetMeshes = [];

      const data = LEVELS[index];

      gridRows = data.length;
      gridCols = Math.max(...data.map(row => row.length));

      playerPos = { x: 0, z: 0 };

      for (let z = 0; z < gridRows; z++) {
        const row = data[z];

        for (let x = 0; x < gridCols; x++) {
          // Treat a missing trailing cell as wall so a short row can
          // never open a hole in the boundary.
          const ch = row[x] || "#";

          if (ch === "#") {
            addWall(x, z);
          } else {
            addFloor(x, z);
          }

          if (ch === "." || ch === "+") {
            addTarget(x, z);
          }

          if (ch === "@" || ch === "+") {
            playerPos = { x, z };
          }

          if (ch === "$" || ch === "*") {
            addCrate(x, z);
          }
        }
      }

      playerMesh = createPlayer(playerPos);
      levelGroup.add(playerMesh);

      frameLevel();
      updateCrateHighlights();
      updateHUD();

      showToast(`Level ${levelIndex + 1} Loaded`);

      // Re-arm the first-move hint; it fades in shortly after load.
      clearTimeout(hintTimer);
      hintEl.classList.remove("show");
      hintTimer = setTimeout(() => {
        hintEl.classList.add("show");
      }, 650);
    }

    // =====================================================================
    // Mesh factories
    // =====================================================================

    function addWall(x, z) {
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshStandardMaterial({
        color: 0x3b82f6,
        roughness: 0.32,
        metalness: 0.12,
        emissive: 0x0ea5e9,
        emissiveIntensity: 0.12
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, 0.5, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      levelGroup.add(mesh);
      wallSet.add(key(x, z));
    }

    function addFloor(x, z) {
      const geometry = new THREE.PlaneGeometry(0.98, 0.98);
      const material = new THREE.MeshStandardMaterial({
        color: 0x2c313a,
        roughness: 0.95,
        metalness: 0.03
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(x, 0.01, z);
      mesh.receiveShadow = true;

      levelGroup.add(mesh);
    }

    function addTarget(x, z) {
      const geometry = new THREE.PlaneGeometry(0.8, 0.8);
      const material = new THREE.MeshStandardMaterial({
        color: 0x34d399,
        emissive: 0x22c55e,
        emissiveIntensity: 0.45,
        roughness: 0.35,
        transparent: true,
        opacity: 0.92
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(x, 0.03, z);
      mesh.receiveShadow = true;

      levelGroup.add(mesh);
      targetMeshes.push(mesh);
      targetSet.add(key(x, z));
    }

    function addCrate(x, z) {
      const geometry = new THREE.BoxGeometry(0.9, 0.9, 0.9);
      const material = new THREE.MeshStandardMaterial({
        color: 0x9a6a3a,
        roughness: 0.58,
        metalness: 0.08,
        emissive: 0x000000,
        emissiveIntensity: 0
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, 0.45, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      levelGroup.add(mesh);

      const crate = {
        mesh: mesh,
        material: material,
        pos: { x, z }
      };

      crates.push(crate);
      crateMap.set(key(x, z), crate);
    }

    function createPlayer(startPos) {
      const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
      const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.28,
        metalness: 0.05,
        emissive: 0x67e8f9,
        emissiveIntensity: 0.08
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(startPos.x, 0.4, startPos.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      return mesh;
    }

    // =====================================================================
    // Camera framing — straight down, always fitting the whole board
    // =====================================================================

    function frameLevel() {
      const cx = (gridCols - 1) / 2;
      const cz = (gridRows - 1) / 2;

      // Half-extents of the board in world units, with a small margin.
      const halfW = (gridCols - 1) / 2 + 0.6;
      const halfH = (gridRows - 1) / 2 + 0.6;

      // Height needed for the board to fit vertically AND horizontally
      // (the horizontal FOV depends on the window aspect ratio).
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);

      const heightVertical = halfH / Math.tan(vFov / 2);
      const heightHorizontal = halfW / Math.tan(hFov / 2);
      const height = Math.max(heightVertical, heightHorizontal) * 1.05;

      // Perfectly overhead. The tiny -z nudge keeps lookAt() away from
      // the degenerate straight-down case; it is invisible in practice.
      camera.position.set(cx, height, cz - 0.05);
      camera.lookAt(cx, 0, cz);

      cameraBase.copy(camera.position);
      cameraLookAt.set(cx, 0, cz);

      // Keep the sun at an angle so walls and crates still throw
      // readable shadows even with a top-down camera.
      directional.position.set(cx + 9, 18, cz + 5);
      directional.target.position.set(cx, 0, cz);
      directional.target.updateMatrixWorld();

      // Refit the fog to the camera distance so level edges never haze.
      scene.fog.near = height * 1.4;
      scene.fog.far = height * 3.2;
    }

    // =====================================================================
    // HUD
    // =====================================================================

    function updateHUD() {
      levelInfo.innerHTML = `<strong>${levelIndex + 1}</strong>/${LEVELS.length}`;

      const progress = ((levelIndex + 1) / LEVELS.length) * 100;
      progressFill.style.width = `${progress}%`;

      statusMoves.textContent = String(moves);

      const remaining = crates.filter(
        crate => !targetSet.has(key(crate.pos.x, crate.pos.z))
      ).length;

      statusBoxes.textContent = String(remaining);

      const best = getBest(levelIndex);
      statusBest.textContent = best === null ? "—" : String(best);
    }

    function updateCrateHighlights() {
      crates.forEach(crate => {
        const onTarget = targetSet.has(key(crate.pos.x, crate.pos.z));

        crate.material.emissive.setHex(onTarget ? 0x22c55e : 0x000000);
        crate.material.emissiveIntensity = onTarget ? 0.35 : 0;
      });
    }

    // =====================================================================
    // Animation
    // =====================================================================

    function animateMesh(mesh, from, to, duration, onComplete) {
      const gen = levelGeneration;

      const startPos = new THREE.Vector3(from.x, mesh.position.y, from.z);
      const endPos = new THREE.Vector3(to.x, mesh.position.y, to.z);

      const startTime = performance.now();
      animatingCount++;

      function tick(now) {
        const t = Math.min((now - startTime) / (duration * 1000), 1);
        const eased = t * t * (3 - 2 * t);

        mesh.position.lerpVectors(startPos, endPos, eased);

        if (t < 1) {
          requestAnimationFrame(tick);
        } else {
          animatingCount = Math.max(0, animatingCount - 1);

          if (onComplete && gen === levelGeneration) {
            onComplete();
          }
        }
      }

      requestAnimationFrame(tick);
    }

    // =====================================================================
    // Sokoban movement logic
    // =====================================================================

    function tryMove(dx, dz) {
      if (!overlay.hidden || isAnimating()) {
        return false;
      }

      const nx = playerPos.x + dx;
      const nz = playerPos.z + dz;

      if (outOfBounds(nx, nz) || isWall(nx, nz)) {
        return false;
      }

      const crateKey = key(nx, nz);
      const crate = crateMap.get(crateKey);

      const playerFrom = { x: playerPos.x, z: playerPos.z };

      if (crate) {
        const bx = nx + dx;
        const bz = nz + dz;

        const crateTargetKey = key(bx, bz);

        if (outOfBounds(bx, bz) || isWall(bx, bz) || crateMap.has(crateTargetKey)) {
          return false;
        }

        crateMap.delete(crateKey);
        crateMap.set(crateTargetKey, crate);

        const crateFrom = { x: crate.pos.x, z: crate.pos.z };
        const crateTo = { x: bx, z: bz };

        crate.pos = crateTo;
        playerPos = { x: nx, z: nz };

        animateMesh(crate.mesh, crateFrom, crateTo, ANIM_DURATION, null);
        animateMesh(playerMesh, playerFrom, playerPos, ANIM_DURATION, checkWin);
      } else {
        playerPos = { x: nx, z: nz };
        animateMesh(playerMesh, playerFrom, playerPos, ANIM_DURATION, checkWin);
      }

      moves++;
      movementCooldown = MOVE_COOLDOWN;

      updateCrateHighlights();
      updateHUD();

      // First real move committed (from any input source): drop the hint.
      clearTimeout(hintTimer);
      hintEl.classList.remove("show");

      return true;
    }

    function checkWin() {
      if (won) return;
      if (crates.length === 0) return;

      const allOnTargets = crates.every(
        crate => targetSet.has(key(crate.pos.x, crate.pos.z))
      );

      if (!allOnTargets) return;

      won = true;

      const oldBest = getBest(levelIndex);
      if (oldBest === null || moves < oldBest) {
        setBest(levelIndex, moves);
      }

      updateCrateHighlights();
      updateHUD();

      spawnExplosion();
      flashNow();

      hintEl.classList.remove("show");

      const gen = levelGeneration;
      const isLastLevel = levelIndex === LEVELS.length - 1;

      const title = isLastLevel ? "All 100 Levels Complete!" : "Level Complete!";
      const sub = isLastLevel
        ? "Perfect pushing. The warehouse is cleared."
        : `Solved level ${levelIndex + 1} in ${moves} moves.`;

      winTimeout = setTimeout(() => {
        if (gen === levelGeneration) {
          showOverlay(
            title,
            sub,
            isLastLevel ? "Play Again" : "Next Level"
          );
        }
      }, 950);
    }

    // =====================================================================
    // Overlay
    // =====================================================================

    function showOverlay(title, text, nextLabel) {
      overlayTitle.textContent = title;
      overlaySub.textContent = text;

      overlayMoves.textContent = String(moves);
      overlayCrates.textContent = String(crates.length);

      const best = getBest(levelIndex);
      overlayBest.textContent = best === null ? "—" : String(best);

      btnNext.textContent = nextLabel;
      overlay.hidden = false;
    }

    function hideOverlay() {
      overlay.hidden = true;
    }

    // =====================================================================
    // Particles
    // =====================================================================

    function spawnBurst(center, count, maxSpeed) {
      if (!scene) return;

      const geometry = new THREE.BufferGeometry();

      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const velocities = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const ix = i * 3;

        positions[ix] = center.x + (Math.random() - 0.5) * 0.2;
        positions[ix + 1] = center.y + (Math.random() - 0.5) * 0.2;
        positions[ix + 2] = center.z + (Math.random() - 0.5) * 0.2;

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const speed = 1.8 + Math.random() * maxSpeed;

        velocities[ix] = speed * Math.sin(phi) * Math.cos(theta);
        velocities[ix + 1] = speed * Math.cos(phi) + 1.8;
        velocities[ix + 2] = speed * Math.sin(phi) * Math.sin(theta);

        const color = PARTICLE_COLORS[(Math.random() * PARTICLE_COLORS.length) | 0];

        colors[ix] = color.r;
        colors[ix + 1] = color.g;
        colors[ix + 2] = color.b;
      }

      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.22,
        vertexColors: true,
        transparent: true,
        opacity: 1,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      });

      const points = new THREE.Points(geometry, material);
      scene.add(points);

      particles.push({
        points: points,
        geometry: geometry,
        material: material,
        velocities: velocities,
        life: 0,
        maxLife: 0.9 + Math.random() * 0.5
      });
    }

    function spawnExplosion() {
      spawnBurst(
        new THREE.Vector3(playerMesh.position.x, 0.7, playerMesh.position.z),
        150,
        5.5
      );

      crates.forEach(crate => {
        spawnBurst(
          new THREE.Vector3(crate.pos.x, 0.6, crate.pos.z),
          12,
          3.5
        );
      });
    }

    function updateParticles(delta) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.life += delta;

        const pos = p.geometry.attributes.position.array;
        const vel = p.velocities;

        for (let j = 0; j < pos.length; j += 3) {
          pos[j] += vel[j] * delta;
          pos[j + 1] += vel[j + 1] * delta;
          pos[j + 2] += vel[j + 2] * delta;

          vel[j + 1] -= 6 * delta;
        }

        p.geometry.attributes.position.needsUpdate = true;
        p.material.opacity = Math.max(0, 1 - (p.life / p.maxLife));

        if (p.life >= p.maxLife) {
          scene.remove(p.points);
          p.geometry.dispose();
          p.material.dispose();

          particles.splice(i, 1);
        }
      }
    }

    // =====================================================================
    // Input
    // =====================================================================

    function bindInput() {
      window.addEventListener("keydown", e => {
        if (e.code === "KeyR") {
          e.preventDefault();
          hideOverlay();
          loadLevel(levelIndex);
          return;
        }

        if ((e.code === "KeyN" || e.code === "Enter") && !overlay.hidden) {
          e.preventDefault();
          btnNext.click();
          return;
        }

        if (e.code === "BracketLeft") {
          e.preventDefault();
          hideOverlay();
          loadLevel((levelIndex + LEVELS.length - 1) % LEVELS.length);
          return;
        }

        if (e.code === "BracketRight") {
          e.preventDefault();
          hideOverlay();
          loadLevel((levelIndex + 1) % LEVELS.length);
          return;
        }

        if (DIRS[e.code] && !e.repeat) {
          e.preventDefault();

          if (!heldDirs.includes(e.code)) {
            heldDirs.push(e.code);
          }
        }
      });

      window.addEventListener("keyup", e => {
        const index = heldDirs.indexOf(e.code);

        if (index >= 0) {
          heldDirs.splice(index, 1);
        }
      });

      window.addEventListener("blur", () => {
        heldDirs.length = 0;
      });

      let pointerStart = null;

      renderer.domElement.addEventListener("pointerdown", e => {
        pointerStart = {
          x: e.clientX,
          y: e.clientY
        };

        renderer.domElement.setPointerCapture(e.pointerId);
      });

      renderer.domElement.addEventListener("pointerup", e => {
        if (!pointerStart) return;

        const dx = e.clientX - pointerStart.x;
        const dy = e.clientY - pointerStart.y;

        pointerStart = null;

        if (Math.abs(dx) < MIN_SWIPE && Math.abs(dy) < MIN_SWIPE) {
          return;
        }

        if (Math.abs(dx) > Math.abs(dy)) {
          tryMove(dx > 0 ? 1 : -1, 0);
        } else {
          tryMove(0, dy > 0 ? 1 : -1);
        }
      });

      renderer.domElement.addEventListener("pointercancel", () => {
        pointerStart = null;
      });

      renderer.domElement.addEventListener("contextmenu", e => {
        e.preventDefault();
      });

      btnRestart.addEventListener("click", () => {
        btnRestart.blur();
        hideOverlay();
        loadLevel(levelIndex);
      });

      btnNext.addEventListener("click", () => {
        btnNext.blur();
        hideOverlay();

        if (levelIndex < LEVELS.length - 1) {
          loadLevel(levelIndex + 1);
        } else {
          loadLevel(0);
        }
      });
    }

    // =====================================================================
    // Main loop
    // =====================================================================

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const t = performance.now() * 0.001;

      movementCooldown = Math.max(0, movementCooldown - delta);

      if (
        overlay.hidden &&
        !isAnimating() &&
        heldDirs.length > 0 &&
        movementCooldown === 0
      ) {
        const code = heldDirs[heldDirs.length - 1];
        const dir = DIRS[code];

        if (dir) {
          tryMove(dir.x, dir.z);
        }
      }

      targetMeshes.forEach(mesh => {
        const offset = mesh.position.x * 0.9 + mesh.position.z * 0.7;
        const pulse = Math.sin(t * 3.2 + offset);

        if (mesh.material) {
          mesh.material.emissiveIntensity = 0.35 + pulse * 0.22;
        }

        const scale = 1 + pulse * 0.035;
        mesh.scale.set(scale, 1, scale);
      });

      if (playerMesh && playerMesh.material) {
        playerMesh.material.emissiveIntensity =
          0.08 + (Math.sin(t * 4) * 0.5 + 0.5) * 0.08;
      }

      updateParticles(delta);

      // The camera sits straight over the board, so the idle drift and
      // mouse parallax are kept small enough that the goals never drift
      // out of view while the scene still feels alive.
      camera.position.set(
        cameraBase.x + Math.sin(t * 0.32) * 0.09 + mouseNX * 0.2,
        cameraBase.y - mouseNY * 0.1,
        cameraBase.z + Math.cos(t * 0.27) * 0.09
      );

      camera.lookAt(cameraLookAt.x, 0, cameraLookAt.z);

      renderer.render(scene, camera);
    }

    // =====================================================================
    // Start
    // =====================================================================

    initThree();
    bindInput();
    loadLevel(0);
    animate();
  </script>
</body>
</html>
